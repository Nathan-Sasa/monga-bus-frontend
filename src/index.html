<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <title>Monga Bus</title>
        <base href="/">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" type="image/x-icon" href="favicon.ico">

        <script>
                const theme = localStorage.getItem('theme-preference');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

                // Si le thème est explicitement 'dark' ou si c'est 'system' et l'OS est sombre
                if (theme === 'dark' || (theme === 'system' && prefersDark) || (!theme && prefersDark)) {
                    document.documentElement.classList.add('dark');
                } else  {
                    document.documentElement.classList.remove('dark');
                }
        </script>
    </head>
    <body class="selection:bg-brand-accent-light dark:selection:bg-brand-accent-light/60 selection:text-brand-primary">
        <app-root></app-root>
    </body>
</html>
